[package]
name = "vibn-desktop"
version = "0.1.0"
edition = "2024"
description = "Native desktop GUI for vibn"

[lib]
name = "vibn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vibn-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vibn-core = { path = "../vibn-core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ignore = "0.4"
notify = "8"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSButton"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-application-services = { version = "0.3", features = ["AXUIElement"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow"] }
